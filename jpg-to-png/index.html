<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Конвертировать JPG в PNG онлайн бесплатно. Изменение размера выполняется локально в браузере."><meta name="theme-color" content="#06101d"><link rel="canonical" href="https://alexdlab.com/jpg-to-png/"><link rel="icon" href="/favicon.svg"><title>JPG в PNG онлайн — Alex D Lab</title><style>:root{--t:#f6f8fc;--m:#9eafc5;--l:rgba(255,255,255,.1);--c:#6fe9ff;--v:#a58cff;--g:#77edb2;--r:#ff8da0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17325a 0,#07111f 40%,#050b15 100%);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;color:#fff;text-decoration:none}.back{font-size:12px;color:#b9c7d8;text-decoration:none}.hero{padding:55px 0 24px}.ey{font-size:11px;letter-spacing:.14em;color:var(--c);font-weight:900}.hero h1{font-size:clamp(32px,5vw,50px);letter-spacing:-.045em;margin:10px 0}.hero p{color:#c1cedd;line-height:1.6}.card{border:1px solid var(--l);border-radius:22px;padding:24px;background:rgba(255,255,255,.035);box-shadow:0 24px 70px rgba(0,0,0,.24)}.drop{display:block;border:1px dashed rgba(111,233,255,.38);border-radius:15px;padding:26px;text-align:center;cursor:pointer;background:rgba(111,233,255,.04)}.drop input{display:none}.preview{max-width:100%;max-height:380px;display:none;margin:14px auto 0;border-radius:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.field{width:100%;border:1px solid var(--l);background:#07111e;color:#fff;border-radius:10px;padding:11px}.btn{width:100%;margin-top:12px;border:0;border-radius:11px;padding:13px;font-weight:900;cursor:pointer;background:linear-gradient(110deg,var(--c),var(--v));color:#06101d}.status{margin-top:12px;border:1px solid var(--l);border-radius:10px;background:#07111e;padding:11px;color:var(--m);font-size:12px}.ok{color:var(--g)}.err{color:var(--r)}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">ALEX D LAB</a><a class="back" href="/">← Все инструменты</a></nav><section class="hero"><div class="ey">IMAGE CONVERTER</div><h1>JPG → PNG</h1><p>Конвертация, изменение размера и очистка метаданных через повторный рендеринг изображения в браузере.</p></section><section class="card"><label class="drop">Выбрать JPG<input id="file" type="file" accept="image/jpeg,.jpg,.jpeg"></label><img id="preview" class="preview" alt="Предпросмотр"><div class="row"><input id="w" class="field" type="number" placeholder="Ширина, px"><input id="h" class="field" type="number" placeholder="Высота, px"></div><button class="btn" id="go">Конвертировать и скачать PNG</button><div class="status" id="st">Файл ещё не выбран.</div></section></div><script>const f=document.querySelector('#file'),p=document.querySelector('#preview'),st=document.querySelector('#st'),wi=document.querySelector('#w'),hi=document.querySelector('#h');let img;f.onchange=()=>{const x=f.files[0];if(!x)return;img=new Image();img.onload=()=>{p.src=img.src;p.style.display='block';wi.value=img.width;hi.value=img.height;st.textContent=`${x.name} · ${img.width}×${img.height}`};img.src=URL.createObjectURL(x)};document.querySelector('#go').onclick=()=>{if(!img)return st.textContent='Выберите JPG.';const w=Math.max(1,+wi.value||img.width),h=Math.max(1,+hi.value||img.height),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{if(!b){st.className='status err';st.textContent='Не удалось создать PNG.';return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='alexdlab.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);st.className='status ok';st.textContent='Готово. PNG скачан.'},'image/png')};</script></body></html>

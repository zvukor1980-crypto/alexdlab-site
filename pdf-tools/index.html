<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Объединить PDF, разделить PDF и собрать PDF из JPG/PNG онлайн бесплатно в Alex D Lab."><meta name="theme-color" content="#06101d"><link rel="canonical" href="https://alexdlab.com/pdf-tools/"><link rel="icon" href="/favicon.svg"><title>PDF инструменты онлайн — Alex D Lab</title><style>:root{--t:#f6f8fc;--m:#9eafc5;--l:rgba(255,255,255,.1);--c:#6fe9ff;--v:#a58cff;--g:#77edb2;--r:#ff8da0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17325a 0,#07111f 40%,#050b15 100%);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{width:min(980px,calc(100% - 28px));margin:auto}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;color:#fff;text-decoration:none}.back{font-size:12px;color:#b9c7d8;text-decoration:none}.hero{padding:55px 0 24px}.ey{font-size:11px;letter-spacing:.14em;color:var(--c);font-weight:900}.hero h1{font-size:clamp(32px,5vw,50px);letter-spacing:-.045em;margin:10px 0}.hero p{color:#c1cedd;line-height:1.6}.card{border:1px solid var(--l);border-radius:22px;padding:24px;background:rgba(255,255,255,.035);box-shadow:0 24px 70px rgba(0,0,0,.24)}.drop{display:block;border:1px dashed rgba(111,233,255,.38);border-radius:15px;padding:26px;text-align:center;cursor:pointer;background:rgba(111,233,255,.04)}.drop input{display:none}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.btn{border:0;border-radius:11px;padding:13px;font-weight:900;cursor:pointer;background:linear-gradient(110deg,var(--c),var(--v));color:#06101d}.secondary{background:#111f33;color:#fff;border:1px solid var(--l)}.status{margin-top:12px;border:1px solid var(--l);border-radius:10px;background:#07111e;padding:11px;color:var(--m);font-size:12px}.ok{color:var(--g)}.err{color:var(--r)}.downloads{display:grid;gap:7px;margin-top:10px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--l);border-radius:10px;padding:9px;font-size:11px;background:#07111e}.item button{border:0;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}@media(max-width:660px){.row{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">ALEX D LAB</a><a class="back" href="/">← Все инструменты</a></nav><section class="hero"><div class="ey">PDF STUDIO</div><h1>PDF инструменты</h1><p>Объединяйте PDF, разделяйте документ по страницам или создавайте PDF из JPG/PNG — прямо в браузере.</p></section><section class="card"><label class="drop">Выбрать PDF или изображения<input id="files" type="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" multiple></label><div class="row"><button class="btn" id="merge">Объединить PDF</button><button class="btn secondary" id="split">Разделить PDF</button><button class="btn secondary" id="imgpdf">Фото → PDF</button></div><div class="status" id="st">Файлы ещё не выбраны.</div><div class="downloads" id="out"></div></section></div><script>const fs=document.querySelector('#files'),st=document.querySelector('#st'),out=document.querySelector('#out');fs.onchange=()=>st.textContent=fs.files.length?`Выбрано файлов: ${fs.files.length}`:'Файлы ещё не выбраны.';function add(blob,name){const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent=name;const b=document.createElement('button');b.textContent='Скачать';b.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};d.append(s,b);out.appendChild(d)}document.querySelector('#merge').onclick=async()=>{const a=[...fs.files].filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));if(!a.length)return st.textContent='Выберите PDF.';try{out.innerHTML='';const doc=await PDFLib.PDFDocument.create();for(const f of a){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await doc.copyPages(src,src.getPageIndices());pages.forEach(p=>doc.addPage(p))}add(new Blob([await doc.save()],{type:'application/pdf'}),'alexdlab-merged.pdf');st.className='status ok';st.textContent='PDF объединён.'}catch(e){st.className='status err';st.textContent='Ошибка: '+e.message}};document.querySelector('#split').onclick=async()=>{const f=[...fs.files].find(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));if(!f)return st.textContent='Выберите PDF.';try{out.innerHTML='';const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());for(const i of src.getPageIndices()){const d=await PDFLib.PDFDocument.create(),[p]=await d.copyPages(src,[i]);d.addPage(p);add(new Blob([await d.save()],{type:'application/pdf'}),`page-${i+1}.pdf`)}st.className='status ok';st.textContent=`Создано страниц: ${src.getPageCount()}.`}catch(e){st.className='status err';st.textContent='Ошибка: '+e.message}};document.querySelector('#imgpdf').onclick=async()=>{const a=[...fs.files].filter(f=>f.type==='image/jpeg'||f.type==='image/png');if(!a.length)return st.textContent='Выберите JPG/PNG.';try{out.innerHTML='';const d=await PDFLib.PDFDocument.create();for(const f of a){const ar=await f.arrayBuffer(),im=f.type==='image/png'?await d.embedPng(ar):await d.embedJpg(ar),p=d.addPage([im.width,im.height]);p.drawImage(im,{x:0,y:0,width:im.width,height:im.height})}add(new Blob([await d.save()],{type:'application/pdf'}),'alexdlab-images.pdf');st.className='status ok';st.textContent='PDF из изображений создан.'}catch(e){st.className='status err';st.textContent='Ошибка: '+e.message}};</script></body></html>

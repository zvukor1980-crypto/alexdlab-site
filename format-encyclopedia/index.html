<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Format Encyclopedia Alex D Lab — справочник популярных форматов, MIME, magic bytes и направлений конвертации."><link rel="canonical" href="https://alexdlab.com/format-encyclopedia/"><title>Format Encyclopedia — Alex D Lab</title><style>:root{--t:#f8fafc;--m:#91a3bb;--l:rgba(255,255,255,.1);--c:#6fe9ff;--v:#a58cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#263b72,#07101d 38%,#04070d 85%);color:var(--t);font-family:Inter,system-ui}.shell{width:min(1120px,calc(100% - 28px));margin:auto}a{color:inherit;text-decoration:none}.nav{height:68px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.back{border:1px solid var(--l);padding:9px 12px;border-radius:12px}.hero{padding:42px 0 22px}.hero h1{font-size:clamp(36px,6vw,60px);margin:8px 0 10px;letter-spacing:-.05em}.hero p{color:var(--m)}.search{width:100%;height:52px;border:1px solid var(--l);background:#07111e;color:white;border-radius:15px;padding:0 16px;font:inherit;margin:14px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-bottom:50px}.card{border:1px solid var(--l);border-radius:18px;padding:16px;background:rgba(255,255,255,.03)}.card h2{font-size:20px;margin:0 0 7px}.card p{font-size:11px;color:var(--m);line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:10px;border:1px solid var(--l);padding:5px 7px;border-radius:999px}.go{display:inline-block;margin-top:9px;color:var(--c);font-weight:850;font-size:11px}.footer{border-top:1px solid var(--l);padding:22px 0 30px;color:#71839c;font-size:12px}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">ALEX D LAB</a><a class="back" href="/">← Главная</a></nav><section class="hero"><div style="font-size:11px;color:var(--c);font-weight:900;letter-spacing:.13em">FORMAT ENCYCLOPEDIA</div><h1>Форматы файлов без магии</h1><p>MIME, сигнатуры, назначение и куда конвертировать.</p></section><input class="search" id="q" placeholder="Например: DJVU, MP3, DWG, EPUB, PNG, XLSX..."><main class="grid" id="grid"></main><footer class="footer">© 2026 Alex D Lab · Format Encyclopedia</footer></div><script>const D=[['MP3','audio/mpeg','ID3 / FF FB','Сжатое аудио','/mp3-to-wav/','WAV OGG FLAC'],['WAV','audio/wav','RIFF....WAVE','Несжатое/PCM аудио','/#media','MP3 OGG FLAC'],['FLAC','audio/flac','66 4C 61 43','Lossless аудио','/#media','MP3 WAV OGG'],['OGG','audio/ogg','4F 67 67 53','Контейнер аудио/видео','/#media','MP3 WAV'],['MP4','video/mp4','....ftyp','Видео-контейнер','/mp4-to-mp3/','MP3 WebM GIF'],['WEBM','video/webm','1A 45 DF A3','Web-видео','/#media','MP4 MP3'],['MKV','video/x-matroska','1A 45 DF A3','Matroska-контейнер','/#media','MP4 WebM'],['JPG','image/jpeg','FF D8 FF','Фото','/jpg-to-png/','PNG WebP'],['PNG','image/png','89 50 4E 47','Lossless изображение','/#images','JPG WebP'],['WEBP','image/webp','RIFF....WEBP','Web-изображение','/#images','JPG PNG'],['AVIF','image/avif','....ftypavif','Современное изображение','/creative-studio/','PNG JPG'],['HEIC','image/heic','....ftypheic','Apple HEIF','/file-doctor/','JPG PNG'],['PDF','application/pdf','25 50 44 46','Документ','/pdf-tools/','JPG / pages'],['DJVU','image/vnd.djvu','AT&TFORM','Сканированные документы','/file-doctor/','PDF (нужен backend)'],['XLSX','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','50 4B 03 04','Excel OOXML','/xlsx-to-csv/','CSV JSON ODS'],['CSV','text/csv','текст','Табличный текст','/#tables','XLSX JSON'],['DOCX','application/vnd.openxmlformats-officedocument.wordprocessingml.document','50 4B 03 04','Word OOXML','/file-doctor/','PDF/TXT (частично)'],['ZIP','application/zip','50 4B 03 04','Архив','/#archive','Extract'],['RAR','application/vnd.rar','52 61 72 21','Архив','/file-doctor/','ZIP (backend/WASM)'],['7Z','application/x-7z-compressed','37 7A BC AF 27 1C','Архив','/file-doctor/','ZIP (backend/WASM)'],['EPUB','application/epub+zip','50 4B 03 04','Электронная книга','/file-doctor/','HTML/TXT'],['FB2','application/xml','XML','Электронная книга','/tools-extra/','TXT/HTML'],['DWG','image/vnd.dwg','AC10xx','AutoCAD drawing','/file-doctor/','DXF/PDF (backend)'],['DXF','image/vnd.dxf','текст/binary','CAD exchange','/file-doctor/','DWG/SVG (backend)'],['STL','model/stl','solid / binary','3D mesh','/file-lab/','OBJ (future 3D Lab)'],['OBJ','model/obj','text','3D geometry','/file-lab/','STL (future 3D Lab)'],['GPX','application/gpx+xml','XML','GPS track','/tools-extra/','GeoJSON (future Geo Lab)'],['KML','application/vnd.google-earth.kml+xml','XML','Geo data','/tools-extra/','GeoJSON'],['SRT','application/x-subrip','text','Субтитры','/tools-extra/','VTT'],['VTT','text/vtt','WEBVTT','Web subtitles','/tools-extra/','SRT']];const g=document.querySelector('#grid');function render(q=''){q=q.toLowerCase();g.innerHTML=D.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<article class="card"><h2>.${x[0]}</h2><div class="chips"><span class="chip">${x[1]}</span><span class="chip">${x[2]}</span></div><p>${x[3]}</p><p>Конвертация: ${x[5]}</p><a class="go" href="${x[4]}">Открыть инструмент →</a></article>`).join('')}document.querySelector('#q').oninput=e=>render(e.target.value);render();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Извлечь MP3 из MP4 онлайн бесплатно в Alex D Lab. Локальная обработка через браузер."><meta name="theme-color" content="#06101d"><link rel="canonical" href="https://alexdlab.com/mp4-to-mp3/"><link rel="icon" href="/favicon.svg"><title>MP4 в MP3 онлайн — Alex D Lab</title><style>:root{--p:#0b192b;--t:#f6f8fc;--m:#9eafc5;--l:rgba(255,255,255,.1);--c:#6fe9ff;--v:#a58cff;--g:#77edb2;--r:#ff8da0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17325a 0,#07111f 40%,#050b15 100%);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;color:#fff;text-decoration:none}.back{font-size:12px;color:#b9c7d8;text-decoration:none}.hero{padding:55px 0 24px}.ey{font-size:11px;letter-spacing:.14em;color:var(--c);font-weight:900}.hero h1{font-size:clamp(32px,5vw,50px);letter-spacing:-.045em;margin:10px 0}.hero p{color:#c1cedd;line-height:1.6}.card{border:1px solid var(--l);border-radius:22px;padding:24px;background:rgba(255,255,255,.035);box-shadow:0 24px 70px rgba(0,0,0,.24)}.drop{display:block;border:1px dashed rgba(111,233,255,.38);border-radius:15px;padding:28px;text-align:center;cursor:pointer;background:rgba(111,233,255,.04)}.drop input{display:none}.preview{width:100%;max-height:340px;margin-top:12px;border-radius:12px;background:#000;display:none}.btn{width:100%;margin-top:12px;border:0;border-radius:11px;padding:13px;font-weight:900;cursor:pointer;background:linear-gradient(110deg,var(--c),var(--v));color:#06101d}.status{margin-top:12px;border:1px solid var(--l);border-radius:10px;background:#07111e;padding:11px;color:var(--m);font-size:12px}.ok{color:var(--g)}.err{color:var(--r)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 50px}.fact{border:1px solid var(--l);border-radius:14px;padding:15px;background:rgba(255,255,255,.025)}.fact span{font-size:11px;color:var(--m)}@media(max-width:620px){.facts{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">ALEX D LAB</a><a class="back" href="/">← Все инструменты</a></nav><section class="hero"><div class="ey">VIDEO → AUDIO</div><h1>MP4 → MP3</h1><p>Извлеките аудиодорожку из видео и скачайте MP3. Обработка выполняется локально в браузере.</p></section><section class="card"><label class="drop">Выбрать MP4<input id="file" type="file" accept="video/mp4,.mp4,video/*"></label><video id="preview" class="preview" controls></video><button class="btn" id="go">Извлечь MP3</button><div class="status" id="st">Файл ещё не выбран.</div></section><div class="facts"><div class="fact"><b>Предпросмотр</b><br><span>Проверьте видео перед обработкой.</span></div><div class="fact"><b>Локально</b><br><span>Видео не отправляется на сервер.</span></div><div class="fact"><b>MP3</b><br><span>Готовый аудиофайл скачивается сразу.</span></div></div></div><script>const f=document.querySelector('#file'),st=document.querySelector('#st'),pv=document.querySelector('#preview');let ff;async function getFF(){if(ff)return ff;ff=FFmpeg.createFFmpeg({log:false});await ff.load();return ff}function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}f.onchange=()=>{const x=f.files[0];if(!x)return;pv.src=URL.createObjectURL(x);pv.style.display='block';st.textContent=`${x.name} · ${(x.size/1048576).toFixed(2)} MB`};document.querySelector('#go').onclick=async()=>{const x=f.files[0];if(!x)return st.textContent='Выберите MP4.';try{st.className='status';st.textContent='Загрузка движка и извлечение аудио…';const e=await getFF(),i='input.mp4',o='alexdlab-audio.mp3';e.FS('writeFile',i,await FFmpeg.fetchFile(x));await e.run('-i',i,'-vn','-q:a','2',o);const d=e.FS('readFile',o);save(new Blob([d.buffer],{type:'audio/mpeg'}),o);st.className='status ok';st.textContent='Готово. MP3 скачан.'}catch(err){st.className='status err';st.textContent='Ошибка: '+err.message}};</script></body></html>

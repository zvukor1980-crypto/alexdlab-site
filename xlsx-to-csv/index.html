<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Конвертировать XLSX в CSV онлайн бесплатно в Alex D Lab. Локальная обработка через SheetJS."><meta name="theme-color" content="#06101d"><link rel="canonical" href="https://alexdlab.com/xlsx-to-csv/"><link rel="icon" href="/favicon.svg"><title>XLSX в CSV онлайн — Alex D Lab</title><style>:root{--t:#f6f8fc;--m:#9eafc5;--l:rgba(255,255,255,.1);--c:#6fe9ff;--v:#a58cff;--g:#77edb2;--r:#ff8da0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17325a 0,#07111f 40%,#050b15 100%);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;color:#fff;text-decoration:none}.back{font-size:12px;color:#b9c7d8;text-decoration:none}.hero{padding:55px 0 24px}.ey{font-size:11px;letter-spacing:.14em;color:var(--c);font-weight:900}.hero h1{font-size:clamp(32px,5vw,50px);letter-spacing:-.045em;margin:10px 0}.hero p{color:#c1cedd;line-height:1.6}.card{border:1px solid var(--l);border-radius:22px;padding:24px;background:rgba(255,255,255,.035);box-shadow:0 24px 70px rgba(0,0,0,.24)}.drop{display:block;border:1px dashed rgba(111,233,255,.38);border-radius:15px;padding:26px;text-align:center;cursor:pointer;background:rgba(111,233,255,.04)}.drop input{display:none}.field{width:100%;margin-top:12px;border:1px solid var(--l);background:#07111e;color:#fff;border-radius:10px;padding:11px}.btn{width:100%;margin-top:12px;border:0;border-radius:11px;padding:13px;font-weight:900;cursor:pointer;background:linear-gradient(110deg,var(--c),var(--v));color:#06101d}.status{margin-top:12px;border:1px solid var(--l);border-radius:10px;background:#07111e;padding:11px;color:var(--m);font-size:12px}.ok{color:var(--g)}.err{color:var(--r)}.preview{margin-top:12px;max-height:280px;overflow:auto;border:1px solid var(--l);border-radius:10px}.preview table{border-collapse:collapse;width:100%;font-size:11px}.preview td,.preview th{border-bottom:1px solid var(--l);padding:7px;text-align:left;white-space:nowrap}</style><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">ALEX D LAB</a><a class="back" href="/">← Все инструменты</a></nav><section class="hero"><div class="ey">SPREADSHEET CONVERTER</div><h1>XLSX → CSV</h1><p>Выберите Excel-файл, нужный лист и скачайте CSV. Обработка выполняется локально в браузере.</p></section><section class="card"><label class="drop">Выбрать XLSX<input id="file" type="file" accept=".xlsx,.xls,.xlsb,.ods"></label><select id="sheet" class="field" disabled><option>Сначала выберите файл</option></select><button class="btn" id="go">Скачать CSV</button><div class="status" id="st">Файл ещё не выбран.</div><div class="preview" id="preview"></div></section></div><script>const f=document.querySelector('#file'),sel=document.querySelector('#sheet'),st=document.querySelector('#st'),pv=document.querySelector('#preview');let wb;async function load(){const x=f.files[0];if(!x)return;try{wb=XLSX.read(await x.arrayBuffer(),{type:'array'});sel.innerHTML=wb.SheetNames.map(n=>`<option>${n}</option>`).join('');sel.disabled=false;render();st.textContent=`${x.name} · листов: ${wb.SheetNames.length}`}catch(e){st.className='status err';st.textContent='Ошибка чтения: '+e.message}}function render(){if(!wb)return;const ws=wb.Sheets[sel.value];pv.innerHTML=XLSX.utils.sheet_to_html(ws,{editable:false})}f.onchange=load;sel.onchange=render;document.querySelector('#go').onclick=()=>{if(!wb)return st.textContent='Выберите XLSX.';const ws=wb.Sheets[sel.value],csv=XLSX.utils.sheet_to_csv(ws),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=(sel.value||'sheet').replace(/[\\/:*?"<>|]/g,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);st.className='status ok';st.textContent='Готово. CSV скачан.'};</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Media Studio Alex D Lab — trim, mute, extract audio, resize and convert video/audio in browser with FFmpeg WASM."><link rel="canonical" href="https://alexdlab.com/media-studio/"><title>Media Studio — Alex D Lab</title><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script><style>:root{--t:#f8fafc;--m:#91a3bb;--l:rgba(255,255,255,.1);--c:#6fe9ff;--v:#a58cff;--g:#78efb4;--r:#ff91a4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#263a70,#07101d 38%,#04070d 85%);color:var(--t);font-family:Inter,system-ui}.shell{width:min(1050px,calc(100% - 28px));margin:auto}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.nav{height:68px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.back{border:1px solid var(--l);padding:9px 12px;border-radius:12px}.hero{padding:42px 0 24px}.hero h1{font-size:clamp(38px,6vw,62px);margin:8px 0 10px;letter-spacing:-.05em}.hero p{color:var(--m)}.panel{border:1px solid var(--l);border-radius:22px;padding:18px;background:rgba(255,255,255,.03);margin-bottom:14px}.drop{display:block;border:1px dashed rgba(111,233,255,.4);border-radius:15px;padding:18px;text-align:center;cursor:pointer}.drop input{display:none}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.field{width:100%;border:1px solid var(--l);background:#07111e;color:white;border-radius:11px;padding:10px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:850;background:linear-gradient(110deg,var(--c),var(--v));color:#06101b;cursor:pointer}.btn.secondary{background:rgba(255,255,255,.07);color:white;border:1px solid var(--l)}.status{margin-top:10px;font-size:11px;color:var(--m)}.preview{margin-top:10px;width:100%;max-height:430px;background:#000;border-radius:14px}.footer{border-top:1px solid var(--l);padding:22px 0 30px;color:#71839c;font-size:12px}@media(max-width:760px){.row{grid-template-columns:1fr}}</style></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">ALEX D LAB</a><a class="back" href="/">← Главная</a></nav><section class="hero"><div style="font-size:11px;color:var(--c);font-weight:900;letter-spacing:.13em">MEDIA STUDIO</div><h1>Видео и аудио прямо в браузере</h1><p>Обрезка, mute, извлечение MP3/WAV, resize и конвертация через FFmpeg WebAssembly.</p></section><section class="panel"><label class="drop">Выберите видео или аудио<input id="file" type="file" accept="audio/*,video/*,.mkv,.mov,.avi,.flac,.m4a,.aac,.opus"></label><video id="vid" class="preview" controls style="display:none"></video><audio id="aud" class="preview" controls style="display:none"></audio><div class="row"><input class="field" id="start" type="number" value="0" step="0.1" placeholder="Start sec"><input class="field" id="dur" type="number" value="10" step="0.1" placeholder="Duration sec"><select class="field" id="mode"><option value="trim-mp4">Trim → MP4</option><option value="mute-mp4">Mute → MP4</option><option value="mp3">Extract → MP3</option><option value="wav">Extract → WAV</option><option value="webm">Convert → WebM</option><option value="720p">Resize → 720p MP4</option></select></div><div class="row"><button class="btn" id="run">Обработать</button><a class="btn secondary" href="/#media">Обычный конвертер</a><a class="btn secondary" href="/video-downloader/">Видео по ссылке</a></div><div class="status" id="status">FFmpeg загрузится при первом запуске.</div></section><footer class="footer">© 2026 Alex D Lab · Media Studio</footer></div><script>const $=s=>document.querySelector(s);let ff;async function getFF(){if(ff)return ff;const{createFFmpeg,fetchFile}=FFmpeg;ff=createFFmpeg({log:false});await ff.load();window.fetchFF=fetchFile;return ff}function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);if(f.type.startsWith('video/')){$('#vid').src=u;$('#vid').style.display='block';$('#aud').style.display='none'}else{$('#aud').src=u;$('#aud').style.display='block';$('#vid').style.display='none'}};$('#run').onclick=async()=>{const f=$('#file').files[0];if(!f)return $('#status').textContent='Выберите файл.';try{$('#status').textContent='Загрузка FFmpeg / обработка...';const x=await getFF(),i='input_'+f.name,m=$('#mode').value,s=String(+$('#start').value||0),d=String(+$('#dur').value||10);x.FS('writeFile',i,await window.fetchFF(f));let out='result.mp4',args=[];if(m==='trim-mp4')args=['-ss',s,'-i',i,'-t',d,'-c:v','libx264','-c:a','aac',out];if(m==='mute-mp4')args=['-i',i,'-an','-c:v','libx264',out];if(m==='mp3'){out='result.mp3';args=['-i',i,'-vn','-codec:a','libmp3lame',out]}if(m==='wav'){out='result.wav';args=['-i',i,'-vn',out]}if(m==='webm'){out='result.webm';args=['-i',i,'-c:v','libvpx','-c:a','libvorbis',out]}if(m==='720p'){out='result-720p.mp4';args=['-i',i,'-vf','scale=-2:720','-c:v','libx264','-c:a','aac',out]}await x.run(...args);const z=x.FS('readFile',out);save(new Blob([z.buffer]),out);$('#status').textContent='Готово.'}catch(e){$('#status').textContent='Ошибка: '+e.message}};</script></body></html>

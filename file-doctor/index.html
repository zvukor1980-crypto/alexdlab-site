<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="File Doctor Alex D Lab — проверка расширения, MIME, magic bytes, SHA-256 и реального типа файла."><link rel="canonical" href="https://alexdlab.com/file-doctor/"><title>File Doctor — Alex D Lab</title><style>:root{--bg:#050914;--t:#f8fafc;--m:#91a2b8;--l:rgba(255,255,255,.1);--c:#6fe9ff;--v:#a58cff;--g:#75efb2;--r:#ff92a4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#24386c,#07101c 40%,#04070d 85%);color:var(--t);font-family:Inter,system-ui}.shell{width:min(980px,calc(100% - 28px));margin:auto}a{color:inherit;text-decoration:none}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950}.back{border:1px solid var(--l);padding:9px 12px;border-radius:12px}.hero{padding:44px 0 26px;text-align:center}.hero h1{font-size:clamp(38px,6vw,64px);margin:8px 0 12px;letter-spacing:-.05em}.hero p{color:var(--m);line-height:1.6}.tag{font-size:11px;color:var(--c);font-weight:900;letter-spacing:.13em}.drop{border:1px dashed rgba(111,233,255,.4);border-radius:22px;padding:38px;text-align:center;background:rgba(111,233,255,.035);cursor:pointer}.drop input{display:none}.panel{margin:14px 0;border:1px solid var(--l);border-radius:18px;padding:18px;background:rgba(255,255,255,.03)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kv{border:1px solid var(--l);border-radius:13px;padding:13px}.kv span{display:block;color:var(--m);font-size:10px;margin-bottom:4px}.ok{color:var(--g)}.bad{color:var(--r)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;word-break:break-all}.btn{display:inline-block;border:0;border-radius:11px;padding:10px 13px;font-weight:850;background:linear-gradient(110deg,var(--c),var(--v));color:#06101b;margin-top:10px}.footer{border-top:1px solid var(--l);padding:22px 0 30px;color:#71839c;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">ALEX D LAB</a><a class="back" href="/">← Главная</a></nav><section class="hero"><div class="tag">FILE FORENSICS</div><h1>File Doctor</h1><p>Проверяет, соответствует ли расширение реальному содержимому файла, показывает MIME, magic bytes и SHA-256.</p></section><label class="drop">Выберите подозрительный или неизвестный файл<input id="file" type="file"></label><section class="panel" id="panel"><div style="color:var(--m)">Файл ещё не выбран.</div></section><footer class="footer">© 2026 Alex D Lab · File Doctor</footer></div><script>const $=s=>document.querySelector(s);const sigs=[{n:'PDF',e:['pdf'],b:[0x25,0x50,0x44,0x46]},{n:'PNG',e:['png'],b:[0x89,0x50,0x4e,0x47]},{n:'JPEG',e:['jpg','jpeg'],b:[0xff,0xd8,0xff]},{n:'GIF',e:['gif'],a:'GIF8'},{n:'ZIP / OOXML',e:['zip','docx','xlsx','pptx','jar','epub'],b:[0x50,0x4b,0x03,0x04]},{n:'RAR',e:['rar'],b:[0x52,0x61,0x72,0x21]},{n:'7Z',e:['7z'],b:[0x37,0x7a,0xbc,0xaf,0x27,0x1c]},{n:'GZIP',e:['gz'],b:[0x1f,0x8b]},{n:'FLAC',e:['flac'],a:'fLaC'},{n:'OGG',e:['ogg','opus'],a:'OggS'},{n:'WAV',e:['wav'],a:'RIFF'},{n:'ELF',e:[''],b:[0x7f,0x45,0x4c,0x46]}];function hex(a){return [...a].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ')}async function sha(b){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}function detect(u){for(const s of sigs){if(s.a){const str=String.fromCharCode(...u.slice(0,s.a.length));if(str===s.a)return s}if(s.b&&s.b.every((v,i)=>u[i]===v))return s}if(u[4]===0x66&&u[5]===0x74&&u[6]===0x79&&u[7]===0x70)return {n:'ISO Base Media (MP4/MOV/HEIC)',e:['mp4','mov','m4a','heic','avif']};return {n:'Неизвестно',e:[]}}$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await f.arrayBuffer(),u=new Uint8Array(b),d=detect(u),ext=(f.name.split('.').pop()||'').toLowerCase(),match=!d.e.length||d.e.includes(ext);const hash=await sha(b);$('#panel').innerHTML=`<div class="grid"><div class="kv"><span>Имя</span><b>${f.name}</b></div><div class="kv"><span>Размер</span><b>${(f.size/1048576).toFixed(3)} MB</b></div><div class="kv"><span>Заявленный MIME</span><b>${f.type||'не задан'}</b></div><div class="kv"><span>Реальный тип по сигнатуре</span><b>${d.n}</b></div><div class="kv"><span>Расширение</span><b>.${ext||'—'}</b></div><div class="kv"><span>Вердикт</span><b class="${match?'ok':'bad'}">${match?'Расширение похоже корректно':'Возможное несоответствие расширения и содержимого'}</b></div></div><div class="kv" style="margin-top:10px"><span>Magic bytes · первые 32 байта</span><div class="mono">${hex(u.slice(0,32))}</div></div><div class="kv" style="margin-top:10px"><span>SHA-256</span><div class="mono">${hash}</div></div><a class="btn" href="/file-lab/">Открыть File Lab Pro</a>`};</script></body></html>

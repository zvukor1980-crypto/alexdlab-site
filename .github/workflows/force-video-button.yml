name: Force visible video button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-force-video]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'videoTopBar' not in s:
              s=s.replace('</style>', '.videoTopBar{position:sticky;top:0;z-index:999;background:linear-gradient(90deg,#6fe9ff,#a58cff);color:#06101d;text-align:center;padding:10px 14px;font-weight:950;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}.videoTopBar a{text-decoration:none;color:#06101d}.videoTopBar a:hover{text-decoration:underline}</style>', 1)
              s=s.replace('<body>', '<body><div class="videoTopBar"><a href="/video-downloader/">⬇ СКАЧАТЬ ВИДЕО ПО ССЫЛКЕ</a></div>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make video downloader impossible to miss [skip-force-video]"
          git push

name: Add extra tools link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-extra-link]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '/tools-extra/' not in s:
              s=s.replace('<a href="#utilities">Инструменты</a>', '<a href="/tools-extra/">Extra Tools</a><a href="#utilities">Инструменты</a>', 1)
              s=s.replace('<a class="btn secondary" href="#tools">Все инструменты</a>', '<a class="btn secondary" href="/tools-extra/">Ещё 20+ инструментов</a><a class="btn secondary" href="#tools">Все инструменты</a>', 1)
              marker='<section class="cats">'
              card='<article class="cat" data-q="extra tools text math electronics units data eng" onclick="location.href=\'/tools-extra/\'"><div class="catIcon">+</div><h3>Extra Tools</h3><p>Текст, математика, электроника, единицы</p></article>'
              s=s.replace(marker, marker+card, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Surface extra tools hub [skip-extra-link]"
          git push

name: Cleanup homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[home-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated navigation CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* compact responsive navigation */'
          first=s.find(marker)
          second=s.find(marker,first+1) if first!=-1 else -1
          if second!=-1:
              end=s.find('</style>',second)
              if end!=-1:
                  s=s[:second]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean duplicated navigation CSS [home-clean]"
          git push
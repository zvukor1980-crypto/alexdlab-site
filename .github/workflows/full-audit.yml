name: Full Alex D Lab audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[audit-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural audit and safe fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import re, json, subprocess, tempfile

          ROOT=Path('.')
          EXCLUDE=('rusdrama/','theatre-demo/')
          htmls=[p for p in ROOT.rglob('*.html') if not any(str(p).startswith(x) for x in EXCLUDE)]
          issues=[]; checked=[]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]; self.ids=[]; self.title=False; self.viewport=False; self.scripts=[]; self.in_script=False; self.script_src=None; self.buf=[]; self.script_type=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.append(a['id'])
                  if tag=='a' and 'href' in a:self.hrefs.append(a['href'])
                  if tag=='title':self.title=True
                  if tag=='meta' and a.get('name','').lower()=='viewport':self.viewport=True
                  if tag=='script':
                      self.in_script=True; self.script_src=a.get('src'); self.script_type=a.get('type',''); self.buf=[]
              def handle_data(self,d):
                  if self.in_script:self.buf.append(d)
              def handle_endtag(self,tag):
                  if tag=='script' and self.in_script:
                      if not self.script_src and self.script_type not in ('application/ld+json','application/json'):
                          self.scripts.append(''.join(self.buf))
                      self.in_script=False

          def internal_exists(src, href):
              if not href or href.startswith(('#','mailto:','tel:','javascript:','data:')): return True
              u=urlparse(href)
              if u.scheme in ('http','https'): return True
              path=u.path
              if not path:return True
              if path.startswith('/'):
                  rel=path.lstrip('/')
              else:
                  rel=str((src.parent/path))
              p=Path(rel)
              candidates=[p]
              if str(path).endswith('/') or p.suffix=='': candidates += [p/'index.html']
              return any(c.exists() for c in candidates)

          jsdir=Path('.audit-js'); jsdir.mkdir(exist_ok=True)
          jsn=0
          for p in htmls:
              txt=p.read_text(encoding='utf-8',errors='replace'); parser=P()
              try: parser.feed(txt)
              except Exception as e: issues.append(f'{p}: HTML parser error: {e}')
              checked.append(str(p))
              if not parser.title: issues.append(f'{p}: missing <title>')
              if not parser.viewport: issues.append(f'{p}: missing viewport meta')
              dup=sorted({x for x in parser.ids if parser.ids.count(x)>1})
              if dup: issues.append(f'{p}: duplicate ids: {", ".join(dup)}')
              for h in parser.hrefs:
                  if not internal_exists(p,h): issues.append(f'{p}: broken internal href {h}')
              for script in parser.scripts:
                  if not script.strip(): continue
                  f=jsdir/f'{jsn}.js'; jsn+=1; f.write_text(script,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: issues.append(f'{p}: JavaScript syntax: {r.stderr.strip().splitlines()[-1] if r.stderr else "error"}')

          # Safe homepage bug fix: don't overwrite explicit category links.
          hp=Path('index.html'); s=hp.read_text(encoding='utf-8')
          old="$$('.cat').forEach(c=>c.onclick=()=>document.getElementById(c.dataset.target)?.scrollIntoView({behavior:'smooth'}));"
          new="$$('.cat[data-target]').forEach(c=>c.onclick=()=>document.getElementById(c.dataset.target)?.scrollIntoView({behavior:'smooth'}));"
          if old in s: s=s.replace(old,new,1)
          s=s.replace('<b>50+</b><span>операций и утилит</span>','<b>80+</b><span>операций и утилит</span>',1)
          hp.write_text(s,encoding='utf-8')

          # Report. Thin SEO landing pages are informational rather than errors.
          thin=[str(p) for p in htmls if p.stat().st_size<1800]
          report=['# Alex D Lab audit','',f'HTML pages checked: {len(checked)}',f'Inline JS blocks syntax-checked: {jsn}',f'Issues found before safe fixes: {len(issues)}','', '## Issues']
          report += [f'- {x}' for x in issues] or ['- No structural/syntax issues found.']
          report += ['', '## Thin landing pages (<1.8 KB)']+[f'- {x}' for x in thin]
          Path('AUDIT_REPORT.md').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY
          rm -rf .audit-js
      - name: Commit audit fixes and report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html AUDIT_REPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit site structure and fix homepage interactions [audit-done]"
          git push
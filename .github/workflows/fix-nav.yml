name: Fix homepage navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nav-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make navigation compact and responsive
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css='''\n/* compact responsive navigation */\n.nav{min-height:68px;height:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:10px 0}.brand{white-space:nowrap}.navlinks{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}.navlinks a{display:inline-flex;align-items:center;white-space:nowrap;padding:8px 9px;border-radius:9px;font-size:11px;color:#c5d0df;line-height:1}.navlinks a:hover{background:rgba(255,255,255,.06);color:#fff}.navMore{position:relative}.navMore summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;color:#dce6f3;white-space:nowrap}.navMore summary::-webkit-details-marker{display:none}.navMoreMenu{position:absolute;right:0;top:42px;z-index:1000;width:230px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#0a1728;box-shadow:0 18px 50px rgba(0,0,0,.45);display:grid;gap:3px}.navMoreMenu a{padding:9px 10px;border-radius:8px;font-size:11px}.navMoreMenu a:hover{background:rgba(111,233,255,.08)}@media(max-width:1080px){.navlinks a:nth-child(n+5){display:none}}@media(max-width:820px){.nav{grid-template-columns:auto 1fr}.navlinks{display:none}.navMore{justify-self:end}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          start=s.find('<nav class="nav">'); end=s.find('</nav>',start)
          if start!=-1 and end!=-1:
            old=s[start:end+6]
            brand_start=old.find('<a class="brand"'); brand_end=old.find('</a>',brand_start)+4
            brand=old[brand_start:brand_end] if brand_start!=-1 else '<a class="brand" href="/"><span class="logo"></span><span>Alex D Lab</span></a>'
            new=brand+'''<div class="navlinks"><a href="#tools">Конвертеры</a><a href="/studio/">Studio</a><a href="/video-downloader/">Видео</a><a href="/file-lab/">File Lab</a></div><details class="navMore"><summary>Все разделы ▾</summary><div class="navMoreMenu"><a href="/universal-converter/">Universal Converter</a><a href="/creative-studio/">Creative Studio</a><a href="/media-studio/">Media Studio</a><a href="/developer-lab/">Developer Lab</a><a href="/file-doctor/">File Doctor</a><a href="/format-encyclopedia/">Форматы файлов</a><a href="/tools-extra/">Extra Tools</a><a href="/pdf-tools/">PDF Tools</a><a href="/video-downloader/">Скачать видео</a></div></details>'''
            s=s[:start]+'<nav class="nav">'+new+'</nav>'+s[end+6:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix compact responsive navigation [nav-fixed]"
          git push
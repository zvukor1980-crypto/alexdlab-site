name: Add quick links block
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-quick-links]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home quick links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="quick-links"' not in s:
              css='''.quickLinks{margin:18px 0 24px}.quickLinksHead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.quickLinksHead h2{font-size:22px;margin:0}.quickLinksHead p{font-size:12px;color:var(--muted);margin:0}.quickLinksGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quickLink{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(145deg,rgba(111,233,255,.07),rgba(165,140,255,.04));transition:.18s}.quickLink:hover{transform:translateY(-2px);border-color:rgba(111,233,255,.38)}.quickLinkIcon{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101d;font-weight:950}.quickLink b{display:block;font-size:13px}.quickLink span{display:block;color:var(--muted);font-size:10px;margin-top:2px}@media(max-width:900px){.quickLinksGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.quickLinksGrid{grid-template-columns:1fr}.quickLinksHead{display:block}.quickLinksHead p{margin-top:5px}}'''
              s=s.replace('</style>',css+'</style>',1)
              block='''<section class="quickLinks" id="quick-links"><div class="quickLinksHead"><h2>Быстрый доступ</h2><p>Самые популярные инструменты — сразу в один клик.</p></div><div class="quickLinksGrid"><a class="quickLink" href="/video-downloader/"><span class="quickLinkIcon">↓</span><span><b>Скачать видео</b><span>MP4, WebM, HLS</span></span></a><a class="quickLink" href="/mp3-to-wav/"><span class="quickLinkIcon">♫</span><span><b>MP3 → WAV</b><span>Аудио-конвертер</span></span></a><a class="quickLink" href="/mp4-to-mp3/"><span class="quickLinkIcon">▶</span><span><b>MP4 → MP3</b><span>Извлечь звук</span></span></a><a class="quickLink" href="/pdf-tools/"><span class="quickLinkIcon">P</span><span><b>PDF Tools</b><span>Объединить и разделить</span></span></a><a class="quickLink" href="/jpg-to-png/"><span class="quickLinkIcon">▧</span><span><b>JPG → PNG</b><span>Изображения</span></span></a><a class="quickLink" href="/xlsx-to-csv/"><span class="quickLinkIcon">▦</span><span><b>XLSX → CSV</b><span>Таблицы</span></span></a><a class="quickLink" href="/tools-extra/"><span class="quickLinkIcon">+</span><span><b>Extra Tools</b><span>20+ утилит</span></span></a><a class="quickLink" href="#tools"><span class="quickLinkIcon">∞</span><span><b>Все конвертеры</b><span>Полный каталог</span></span></a></div></section>'''
              s=s.replace('</header>', '</header>'+block, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit quick links
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add quick-link buttons to home [skip-quick-links]"
          git push

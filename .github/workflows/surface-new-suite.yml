name: Surface new suite
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-new-suite]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          items=[
            ('/universal-converter/','↔','Universal Converter','Умно подбирает действия для файла'),
            ('/file-doctor/','✚','File Doctor','Проверяет расширение и magic bytes'),
            ('/format-encyclopedia/','F','Format Encyclopedia','MIME, сигнатуры и конвертация'),
            ('/media-studio/','▶','Media Studio','Trim, mute, extract audio, resize'),
            ('/developer-lab/','</>','Developer Lab','JSON, Base64, URL, SHA, UUID')]
          if '/universal-converter/' not in s:
            nav='<a href="/universal-converter/">Universal</a><a href="/file-doctor/">File Doctor</a><a href="/media-studio/">Media Studio</a>'
            s=s.replace('<a href="/file-lab/">File Lab Pro</a>', nav+'<a href="/file-lab/">File Lab Pro</a>',1)
            q='<div class="quickLinksGrid">'
            cards=''.join([f'<a class="quickLink" href="{u}"><span class="quickLinkIcon">{i}</span><span><b>{t}</b><span>{d}</span></span></a>' for u,i,t,d in items])
            s=s.replace(q,q+cards,1)
            marker='<section class="featureRibbon">'
            feats=''.join([f'<a class="featureTile" href="{u}"><span class="featureGlyph">{i}</span><b>{t}</b><span>{d}</span></a>' for u,i,t,d in items])
            s=s.replace(marker,marker+feats,1)
            # add primary buttons in hero showcase
            s=s.replace('<div class="modernActions">','<div class="modernActions"><a class="btn" href="/universal-converter/">Universal Converter</a><a class="btn secondary" href="/file-doctor/">File Doctor</a><a class="btn secondary" href="/media-studio/">Media Studio</a>',1)
            p.write_text(s,encoding='utf-8')
          sp=Path('sitemap.xml')
          x=sp.read_text(encoding='utf-8')
          new=['universal-converter','file-doctor','format-encyclopedia','media-studio','developer-lab']
          for name in reversed(new):
            if name not in x:
              x=x.replace('<url><loc>https://alexdlab.com/file-lab/</loc>',f'<url><loc>https://alexdlab.com/{name}/</loc><changefreq>weekly</changefreq><priority>0.96</priority></url>\n  <url><loc>https://alexdlab.com/file-lab/</loc>',1)
          sp.write_text(x,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Surface Universal Converter, File Doctor, Format Encyclopedia, Media Studio and Developer Lab [skip-new-suite]"
          git push
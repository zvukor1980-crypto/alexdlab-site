name: Modernize home
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-modern-home]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modernize homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="modern-showcase"' not in s:
              css='''.modernShowcase{margin:24px 0 30px;border:1px solid rgba(255,255,255,.11);border-radius:24px;overflow:hidden;background:linear-gradient(135deg,rgba(17,31,55,.92),rgba(8,17,31,.96));display:grid;grid-template-columns:1.05fr .95fr;box-shadow:0 28px 80px rgba(0,0,0,.28)}.modernVisual{min-height:360px;background:linear-gradient(180deg,rgba(5,12,24,.05),rgba(5,12,24,.45)),url('/assets/alexdlab-services-v1.png') center/cover no-repeat;position:relative}.modernVisual:after{content:'LOCAL • FAST • PRIVATE';position:absolute;left:22px;bottom:20px;padding:8px 11px;border-radius:999px;background:rgba(5,12,24,.72);border:1px solid rgba(255,255,255,.14);font-size:10px;letter-spacing:.12em;color:#eaf2ff;backdrop-filter:blur(12px)}.modernCopy{padding:34px;display:flex;flex-direction:column;justify-content:center}.modernCopy h2{font-size:clamp(28px,3.5vw,42px);line-height:1.06;letter-spacing:-.04em;margin:8px 0 12px}.modernCopy p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 18px}.modernStats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 18px}.modernStat{border:1px solid var(--line);border-radius:14px;padding:13px;background:rgba(255,255,255,.035)}.modernStat b{display:block;font-size:22px;margin-bottom:3px}.modernStat span{font-size:10px;color:var(--muted)}.modernActions{display:flex;gap:8px;flex-wrap:wrap}.featureRibbon{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 28px}.featureTile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:17px;min-height:130px;background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.02))}.featureTile:before{content:'';position:absolute;width:100px;height:100px;border-radius:50%;right:-30px;top:-34px;background:radial-gradient(circle,rgba(111,233,255,.22),transparent 67%)}.featureTile b{display:block;font-size:14px;margin:10px 0 6px}.featureTile span{font-size:11px;color:var(--muted);line-height:1.45}.featureGlyph{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101d;font-weight:950}.hero,.quickLink,.cat,.tool,.mini,.modernShowcase,.featureTile{backdrop-filter:blur(10px)}.quickLink,.cat,.tool,.mini,.featureTile{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.quickLink:hover,.cat:hover,.tool:hover,.mini:hover,.featureTile:hover{transform:translateY(-3px);border-color:rgba(111,233,255,.34);box-shadow:0 18px 42px rgba(0,0,0,.18)}@media(max-width:880px){.modernShowcase{grid-template-columns:1fr}.modernVisual{min-height:260px}.featureRibbon{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.modernCopy{padding:24px}.modernStats{grid-template-columns:1fr 1fr}.featureRibbon{grid-template-columns:1fr}}'''
              s=s.replace('</style>',css+'</style>',1)
              block='''<section class="modernShowcase" id="modern-showcase"><div class="modernVisual"></div><div class="modernCopy"><div class="eyebrow">ALEX D LAB 2026</div><h2>Один красивый хаб для файлов, медиа, дизайна и инженерных задач</h2><p>Конвертация, обработка, генераторы и вычисления прямо в браузере — без регистрации и без загрузки большинства файлов на сервер.</p><div class="modernStats"><div class="modernStat"><b>50+</b><span>операций и утилит</span></div><div class="modernStat"><b>10+</b><span>категорий</span></div><div class="modernStat"><b>0 ₪</b><span>базовые инструменты</span></div></div><div class="modernActions"><a class="btn" href="/creative-studio/">Creative Studio</a><a class="btn secondary" href="/tools-extra/">Extra Tools</a><a class="btn secondary" href="/video-downloader/">Видео по ссылке</a></div></div></section><section class="featureRibbon"><a class="featureTile" href="/creative-studio/"><span class="featureGlyph">✦</span><b>Creative Studio</b><span>Градиенты, палитры, favicon, фильтры, watermark, poster maker.</span></a><a class="featureTile" href="/video-downloader/"><span class="featureGlyph">↓</span><b>Video Downloader</b><span>Прямые видеофайлы и HLS .m3u8 без DRM.</span></a><a class="featureTile" href="/pdf-tools/"><span class="featureGlyph">P</span><b>PDF Lab</b><span>Объединение, разделение и создание PDF из изображений.</span></a><a class="featureTile" href="/tools-extra/"><span class="featureGlyph">∞</span><b>Utility Lab</b><span>Текст, математика, электроника, единицы, web и data tools.</span></a></section>'''
              marker='<section class="smart" id="smart">'
              s=s.replace(marker,block+marker,1)
              # add Creative Studio to nav and quick links
              s=s.replace('<a href="/tools-extra/">Extra Tools</a>', '<a href="/creative-studio/">Creative Studio</a><a href="/tools-extra/">Extra Tools</a>',1)
              s=s.replace('<a class="quickLink" href="/tools-extra/">', '<a class="quickLink" href="/creative-studio/"><span class="quickLinkIcon">✦</span><span><b>Creative Studio</b><span>Дизайн и фото</span></span></a><a class="quickLink" href="/tools-extra/">',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Update sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          if 'creative-studio' not in s:
              s=s.replace('<url><loc>https://alexdlab.com/video-downloader/</loc>', '<url><loc>https://alexdlab.com/creative-studio/</loc><changefreq>weekly</changefreq><priority>0.95</priority></url>\n  <url><loc>https://alexdlab.com/video-downloader/</loc>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Modernize Alex D Lab homepage and surface Creative Studio [skip-modern-home]"
          git push
